name: Release Linux bundle

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with CVSE-API submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build complete deployment bundle
        run: nix build --no-update-lock-file '.?submodules=1#default'

      - name: Package relocatable bundle
        shell: bash
        run: |
          mkdir -p release/cvse-frontend
          cp -aL result/. release/cvse-frontend/
          test -x release/cvse-frontend/bin/cvse-relay
          test -s release/cvse-frontend/share/cvse-frontend/static/wasm/cvse_wasm_client_bg.wasm
          tar -C release -czf cvse-frontend-linux-x86_64.tar.gz cvse-frontend

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: cvse-frontend-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
