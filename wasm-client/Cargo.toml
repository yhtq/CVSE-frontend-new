[package]
name = "cvse-wasm-client"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capnp = "0.21"
capnp-rpc = "0.21"
capnp-futures = "0.21"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
# Must match nixpkgs wasm-bindgen-cli (see root flake.nix).
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event"] }

[build-dependencies]
capnpc = "0.21"
